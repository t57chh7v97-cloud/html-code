<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlightFlow — Flight Tracker & Travel Assistant</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlightFlow">
<meta name="theme-color" content="#1a1a2e">
<style>
:root{
  --bg:#f0f2f8; --surf:#ffffff; --surf2:#f7f8fc; --bd:#e2e5f0; --bdL:#eef0f7;
  --accent:#4f6ef7; --accentL:#eef1fe; --tx:#0f1117; --tx2:#5b6070; --txM:#9ba3b8;
  --navbar:#1a1a2e; --navbar2:#2d2d4e; --navbar3:#3a3a6e;
  --ok-bg:#dcfce7; --ok-tx:#166534; --warn-bg:#fef3c7; --warn-tx:#5c4400;
  --bad-bg:#fee2e2; --bad-tx:#991b1b; --info-bg:#dbeafe; --info-tx:#1e40af;
  --purp-bg:#ede9fe; --purp-tx:#5b21b6;
  --sh:0 1px 4px rgba(0,0,0,.07); --shM:0 4px 16px rgba(0,0,0,.09); --shL:0 8px 32px rgba(0,0,0,.12);
  --r8:8px; --r12:12px; --r18:18px; --r24:24px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ocean:#b8d8e8; --land:#c8d8a0; --landStroke:#9db07a;
}
[data-mode="dark"]{
  --bg:#0f1117; --surf:#1a1a2e; --surf2:#1e2035; --bd:#2d2d4e; --bdL:#262a45;
  --accent:#6b8eff; --accentL:#232849; --tx:#eef0f7; --tx2:#a8adc0; --txM:#6b7086;
  --ocean:#1e3050; --land:#2d4a3e; --landStroke:#3d5f4e;
}
[data-theme="ocean"]{ --accent:#0284c7; --accentL:#e0f2fe; --bg:#eef7fb; --navbar3:#0369a1; }
[data-theme="ocean"][data-mode="dark"]{ --accent:#38bdf8; --accentL:#0c2c3d; --bg:#0a1a24; --surf:#0f2836; }
[data-theme="sunset"]{ --accent:#ea580c; --accentL:#fff1e6; --bg:#fdf6ee; --navbar:#3a2418; --navbar2:#5a3620; --navbar3:#c2410c; --bd:#f3d9bd; }
[data-theme="sunset"][data-mode="dark"]{ --accent:#fb923c; --accentL:#3a2418; --bg:#1c130c; --surf:#2a1c10; }
[data-theme="forest"]{ --accent:#16a34a; --accentL:#eafbf0; --bg:#f2f9f2; --navbar:#122a1a; --navbar2:#1c3f27; --navbar3:#2f6e42; --bd:#cfe8d6; }
[data-theme="forest"][data-mode="dark"]{ --accent:#4ade80; --accentL:#122a1a; --bg:#0c1710; --surf:#122a1a; }
[data-theme="candy"]{ --accent:#a21caf; --accentL:#faeefe; --bg:#faf3fc; --navbar:#5b1a63; --navbar2:#7c2d8f; --navbar3:#c026d3; --bd:#f0d3f5; }
[data-theme="candy"][data-mode="dark"]{ --accent:#e879f9; --accentL:#3a1140; --bg:#1c0d1f; --surf:#2a1630; }
[data-theme="terminal"]{ --accent:#00ff41; --accentL:#012b0c; --bg:#000; --surf:#0a0f0a; --surf2:#0d140d; --bd:#0f3d1a; --bdL:#0a2812; --tx:#00ff41; --tx2:#00b82f; --txM:#046b1c; --navbar:#000; --navbar2:#001a06; --navbar3:#012b0c; --font:var(--mono); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.4;transition:background .2s,color .2s;padding-bottom:40px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hide{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding:0 1rem}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--navbar),var(--navbar2));color:#fff;box-shadow:var(--shM)}
.navbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;overflow-x:auto}
.brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.brand-icon{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px}
.brand-name{font-weight:800;font-size:16px}
.brand-tag{font-size:10px;opacity:.65;font-weight:500;display:block;margin-top:-2px}
.navbar-right{display:flex;align-items:center;gap:.35rem;margin-left:auto;flex-shrink:0}
.status-badge{font-size:11px;font-weight:600;padding:.3rem .55rem;border-radius:20px;background:rgba(255,255,255,.1);cursor:pointer;white-space:nowrap}
.status-badge.live{background:var(--ok-bg);color:var(--ok-tx)}
.icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.18)}

/* WORLD CLOCK */
.clockstrip{background:var(--surf);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.clockstrip-in{display:inline-flex;gap:.4rem;padding:.5rem 1rem;max-width:960px}
.clock-chip{display:inline-flex;flex-direction:column;align-items:center;background:var(--surf2);border-radius:var(--r8);padding:.35rem .6rem;min-width:64px;border:1px solid var(--bdL)}
.clock-chip.me{background:var(--accentL);border-color:var(--accent)}
.clock-chip b{font-size:12px;font-weight:800}
.clock-chip span{font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}

/* RECENTS */
.recentbar{max-width:960px;margin:0 auto;padding:.5rem 1rem 0;display:flex;gap:.4rem;overflow-x:auto}
.recent-chip{flex-shrink:0;background:var(--accentL);color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:.3rem .7rem;font-size:12px;font-weight:700}

/* HERO */
.hero{background:linear-gradient(135deg,var(--navbar),var(--navbar2) 55%,var(--navbar3));color:#fff;padding:2rem 1rem 2.4rem;text-align:center}
.hero h1{font-size:26px;margin:0 0 .3rem;font-weight:800}
.hero p{opacity:.75;margin:0 0 1.2rem;font-size:13px}
.search-card{max-width:480px;margin:0 auto;background:var(--surf);color:var(--tx);border-radius:var(--r18);padding:1rem;box-shadow:var(--shL);display:flex;gap:.5rem}
.search-card input{flex:1;border:1px solid var(--bd);border-radius:var(--r12);padding:.7rem .8rem;text-transform:uppercase;font-family:var(--mono);font-weight:700;letter-spacing:.5px;background:var(--surf);color:var(--tx)}
.search-card input:focus{outline:none;border-color:var(--accent)}
.btn-track{background:var(--accent);color:#fff;border:none;border-radius:var(--r12);padding:.7rem 1.1rem;font-weight:700;font-size:13px;white-space:nowrap}
.hint-chips{max-width:480px;margin:.7rem auto 0;display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center}
.hint-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:.25rem .6rem;font-size:11px;font-weight:600}

/* DASHBOARD / CARDS */
.dash{max-width:780px;margin:0 auto;padding:1rem}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r18);box-shadow:var(--sh);padding:1.1rem;margin-bottom:.9rem}
.card h3{margin:0 0 .7rem;font-size:14px;font-weight:700}
.welcome{text-align:center;padding:2.4rem 1rem}
.welcome .emoji{font-size:44px}
.welcome h2{margin:.6rem 0 .3rem}
.welcome p{color:var(--tx2);font-size:13px;max-width:420px;margin:0 auto 1.2rem}
.grid-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:420px;margin:0 auto}
.grid-btns button{background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r12);padding:.7rem .3rem;font-size:11px;font-weight:600;display:flex;flex-direction:column;gap:.25rem;align-items:center}
.grid-btns button span:first-child{font-size:18px}

.banner{border-radius:var(--r12);padding:.6rem .8rem;font-size:12px;font-weight:600;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem;justify-content:space-between}
.banner.ok{background:var(--ok-bg);color:var(--ok-tx)}
.banner.warn{background:var(--warn-bg);color:var(--warn-tx)}
.banner.info{background:var(--surf2);color:var(--tx2);border:1px solid var(--bd)}
.banner.kid{background:linear-gradient(90deg,var(--warn-bg),var(--info-bg));color:var(--tx)}
.dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--ok-tx);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.datebar{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.2rem;margin-bottom:.9rem}
.date-chip{flex-shrink:0;min-width:92px;background:var(--surf);border:2px solid var(--bd);border-radius:var(--r12);padding:.5rem .6rem;text-align:center;cursor:pointer}
.date-chip.today{border-color:var(--accent)}
.date-chip.past{opacity:.5}
.date-chip .lbl{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx2)}
.date-chip .ymd{font-size:10px;color:var(--txM)}
.date-chip .stat{font-size:16px;margin:.15rem 0}
.date-chip .statxt{font-size:9px;color:var(--tx2)}
.date-chip .badge2{position:absolute;margin-top:-30px;margin-left:60px;background:var(--accent);color:#fff;font-size:9px;border-radius:8px;padding:0 4px}

.airline-bar{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.9rem;flex-wrap:wrap}
.airline-sq{width:44px;height:44px;border-radius:var(--r12);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.flight-num{font-size:20px;font-weight:800;letter-spacing:1px}
.airline-name{font-size:12px;color:var(--tx2)}
.status-pill{font-size:11px;font-weight:700;padding:.25rem .6rem;border-radius:20px}
.otp-stat{font-size:11px;color:var(--tx2);margin-top:.2rem}
.action-row{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.9rem;width:100%}
.action-btn{flex-shrink:0;background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r12);padding:.5rem .65rem;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:58px}
.action-btn span:first-child{font-size:15px}

.route-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:.9rem;gap:.5rem}
.route-side.right{text-align:right}
.iata{font-size:36px;font-weight:900;letter-spacing:-2px;color:var(--tx);cursor:pointer}
.route-city{font-size:12px;color:var(--tx2)}
.route-time{font-size:22px;font-weight:800;margin:.15rem 0}
.route-tz{font-size:11px;font-weight:700;color:var(--accent)}
.route-date{font-size:11px;color:var(--txM)}
.route-now{display:inline-block;margin-top:.25rem;background:var(--surf2);border:1px solid var(--bd);border-radius:8px;padding:.1rem .4rem;font-size:10px}
.route-mid{text-align:center;font-size:12px;color:var(--tx2)}
.est-badge{display:inline-block;margin-top:.2rem;background:var(--warn-bg);color:var(--warn-tx);font-size:9px;font-weight:700;border-radius:6px;padding:.05rem .3rem}

.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.9rem}
.info-card{background:var(--surf2);border-radius:var(--r12);padding:.55rem .6rem;border-left:3px solid var(--bd)}
.info-card.dep{border-left-color:var(--accent)}
.info-card.arr{border-left-color:#16a34a}
.info-card .lbl{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.info-card .val{font-size:13px;font-weight:700;margin-top:.1rem}
.info-card .val.italic{font-style:italic;font-weight:500}

.countdown{background:var(--accentL);border-radius:var(--r12);padding:.6rem .8rem;font-size:13px;font-weight:600;margin-bottom:.9rem}

.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:.2rem .55rem;margin:.15rem .2rem 0 0}
.pill.yes{background:var(--ok-bg);color:var(--ok-tx)}
.pill.no{background:var(--bad-bg);color:var(--bad-tx)}
.pill.amber{background:var(--warn-bg);color:var(--warn-tx)}
.pill.blue{background:var(--info-bg);color:var(--info-tx)}
.pill.green{background:var(--ok-bg);color:var(--ok-tx)}

.wx-top{display:flex;align-items:center;gap:.8rem}
.wx-emoji{font-size:36px}
.wx-temp{font-size:28px;font-weight:800}
.wx-temp small{font-size:13px;font-weight:500;color:var(--tx2)}
.wx-desc{font-size:12px;color:var(--tx2);text-transform:capitalize}
.wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.wx-grid div{background:var(--surf2);border-radius:var(--r8);padding:.4rem .5rem;font-size:11px}
.wx-grid b{display:block;font-size:12px}
.aqi-bar{height:8px;border-radius:6px;background:var(--surf2);margin-top:.6rem;overflow:hidden}
.aqi-fill{height:100%}
.wx-foot{font-size:10px;color:var(--txM);margin-top:.5rem}

.tabs{display:flex;gap:.3rem;margin-bottom:.7rem;border-bottom:1px solid var(--bd)}
.tab{flex:1;text-align:center;padding:.5rem;font-size:12px;font-weight:700;color:var(--tx2);border:none;background:none;border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-color:var(--accent)}
.progress-bar{height:8px;background:var(--surf2);border-radius:6px;overflow:hidden;margin-bottom:.5rem}
.progress-fill{height:100%;background:var(--accent)}
.check-item{display:flex;align-items:center;gap:.55rem;padding:.4rem 0;border-bottom:1px solid var(--bdL);font-size:13px}
.check-item input{width:16px;height:16px;flex-shrink:0}
.check-item .cat{margin-left:auto;font-size:9px;background:var(--surf2);border-radius:6px;padding:.1rem .35rem;color:var(--tx2)}
.transport-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.transport-grid button{background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r12);padding:.6rem;font-weight:700;font-size:12px}

.map-wrap{width:100%;height:220px;border-radius:var(--r12);overflow:hidden;border:1px solid var(--bd)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.hide{display:none}
.modal{background:var(--surf);color:var(--tx);border-radius:var(--r24);max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shL);padding:1.2rem}
.modal h2{margin:0 0 .8rem;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:var(--surf2);border:none;border-radius:50%;width:28px;height:28px;font-size:14px}
.modal label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--tx2);margin:.7rem 0 .25rem}
.modal input[type=text],.modal input[type=number],.modal input[type=password],.modal input[type=date],.modal select,.modal textarea{width:100%;border:1px solid var(--bd);border-radius:var(--r8);padding:.55rem .6rem;background:var(--surf);color:var(--tx)}
.modal-section{border-top:1px solid var(--bdL);padding-top:.7rem;margin-top:.7rem}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r8);padding:.55rem .9rem;font-weight:700;font-size:12px}
.btn.sec{background:var(--surf2);color:var(--tx);border:1px solid var(--bd)}
.row-flex{display:flex;gap:.5rem;flex-wrap:wrap}
.small-note{font-size:11px;color:var(--tx2)}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}
table.cmp td,table.cmp th{border-bottom:1px solid var(--bdL);padding:.4rem .3rem;text-align:left}
kbd{background:var(--surf2);border:1px solid var(--bd);border-radius:5px;padding:.1rem .4rem;font-family:var(--mono);font-size:11px}

@media(min-width:600px){
  .dash{max-width:720px}
  .info-grid{grid-template-columns:repeat(3,1fr)}
  .grid-btns{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1024px){
  .dash{max-width:780px}
  .map-wrap{height:280px}
}
@media(min-width:1600px){
  .dash{max-width:960px}
  .hero h1{font-size:36px}
  .iata{font-size:48px}
  .route-time{font-size:28px}
  .map-wrap{height:360px}
}
@media(max-width:600px){
  .iata{font-size:26px}
  .card{padding:1rem}
  .map-wrap{height:200px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-in">
    <div class="brand">
      <div class="brand-icon">✈️</div>
      <div><div class="brand-name">FlightFlow</div><span class="brand-tag">Global flight assistant</span></div>
    </div>
    <div class="navbar-right" id="navRight">
      <div class="status-badge" id="statusBadge" onclick="openModal('settings')">Demo mode</div>
      <button class="icon-btn" title="Saved" onclick="openModal('saved')">🔖</button>
      <button class="icon-btn" title="History" onclick="openModal('history')">🕐</button>
      <button class="icon-btn" title="Stats" onclick="openModal('stats')">📊</button>
      <button class="icon-btn" title="Compare" onclick="openModal('compare')">⚖️</button>
      <button class="icon-btn" title="Multi-leg" onclick="openModal('multileg')">🛫</button>
      <button class="icon-btn" title="Meeting Planner" onclick="openModal('meeting')">🕐</button>
      <button class="icon-btn" title="Bag Weight" onclick="openModal('bagweight')">⚖️</button>
      <button class="icon-btn" title="Search Flights" onclick="openModal('routesearch')">🔍</button>
      <button class="icon-btn" title="Travel Docs" onclick="openModal('traveldocs')">📋</button>
      <button class="icon-btn" title="Countries" onclick="openModal('stamps')">🌍</button>
      <button class="icon-btn" title="Bucket List" onclick="openModal('bucket')">🪣</button>
      <button class="icon-btn" title="Shortcuts" onclick="openModal('shortcuts')">⌨️</button>
      <button class="icon-btn" title="Feedback" onclick="openModal('feedback')">💬</button>
      <button class="icon-btn" title="Settings" onclick="openModal('settings')">⚙️</button>
    </div>
  </div>
</nav>

<div class="clockstrip"><div class="clockstrip-in" id="clockStrip"></div></div>
<div class="recentbar" id="recentBar"></div>

<section class="hero">
  <h1>Track any flight, anywhere</h1>
  <p>Live status, weather, maps and everything you need before you fly</p>
  <div class="search-card">
    <input id="flightInput" placeholder="e.g. B6 1368" maxlength="8" onkeydown="if(event.key==='Enter')trackFlight()">
    <button class="btn-track" onclick="trackFlight()">📡 Track</button>
  </div>
  <div class="hint-chips">
    <span class="hint-chip">B6</span><span class="hint-chip">AA</span><span class="hint-chip">DL</span>
    <span class="hint-chip">EK</span><span class="hint-chip">BA</span><span class="hint-chip">WN</span><span class="hint-chip">UA</span>
  </div>
</section>

<div class="dash" id="dash"></div>

<div id="modalRoot"></div>

<script>

 {c:"SEA",city:"Seattle",country:"USA",lat:47.45,lon:-122.31,tz:-8,cur:"USD",lang:"English",plug:"A/B"},
 {c:"MIA",city:"Miami",country:"USA",lat:25.79,lon:-80.29,tz:-5,cur:"USD",lang:"English",plug:"A/B"},
 {c:"BOS",city:"Boston",country:"USA",lat:42.36,lon:-71.01,tz:-5,cur:"USD",lang:"English",plug:"A/B"},
 {c:"DEN",city:"Denver",country:"USA",lat:39.86,lon:-104.67,tz:-7,cur:"USD",lang:"English",plug:"A/B"},
 {c:"LAS",city:"Las Vegas",country:"USA",lat:36.08,lon:-115.15,tz:-8,cur:"USD",lang:"English",plug:"A/B"},
 {c:"PHX",city:"Phoenix",country:"USA",lat:33.43,lon:-112.01,tz:-7,cur:"USD",lang:"English",plug:"A/B"},
 {c:"IAH",city:"Houston",country:"USA",lat:29.98,lon:-95.34,tz:-6,cur:"USD",lang:"English",plug:"A/B"},

function applyTheme(){

}

/* ===================== UNITS / FORMAT HELPERS ===================== */
function fmtTime(date, tzOffset){
  const use24 = LS.get('ff_24', false);
  const utc = date.getTime() + date.getTimezoneOffset()*60000;
  const local = new Date(utc + tzOffset*3600000);
  let h = local.getHours(), m = local.getMinutes();
  const mm = String(m).padStart(2,'0');
  if(use24) return `${String(h).padStart(2,'0')}:${mm}`;
  const ap = h>=12?'PM':'AM'; let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${mm} ${ap}`;
}
function fmtDate(date, tzOffset){
  const utc = date.getTime() + date.getTimezoneOffset()*60000;
  const local = new Date(utc + tzOffset*3600000);
  return local.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function ymd(date, tzOffset){
  const utc = date.getTime() + date.getTimezoneOffset()*60000;
  const local = new Date(utc + tzOffset*3600000);
  return local.toISOString().slice(0,10);
}

/* ===================== FLIGHT TRACKING (demo/estimated engine) ===================== */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; } return h; }

function generateFlight(flightNo){
  const clean = flightNo.replace(/\s+/g,'').toUpperCase();
  const code = clean.slice(0,2);
  const num = clean.slice(2).replace(/\D/g,'') || '100';
  const airline = AIRLINES[code] || {name: code+" Airlines", color:"#4f6ef7"};
  const h = hashStr(flightNo.toUpperCase());
  const depIdx = h % AIRPORTS.length;
  const arrIdx = (h>>3) % AIRPORTS.length;
  const dep = AIRPORTS[depIdx];
  const arr = AIRPORTS[arrIdx===depIdx ? (arrIdx+1)%AIRPORTS.length : arrIdx];
  const distKm = haversine(dep.lat,dep.lon,arr.lat,arr.lon);
  const durMin = Math.round(distKm/800*60) + 30;
  const now = new Date();
  const depOffsetMin = ((h>>5)%180) - 60;
  const depTime = new Date(now.getTime() + depOffsetMin*60000);
  const arrTime = new Date(depTime.getTime() + durMin*60000);
  const statuses = ['Scheduled','Boarding','In Air','Landed','Delayed','On Time'];
  let status = depOffsetMin < -durMin ? 'Landed' : (depOffsetMin < 0 ? 'In Air' : (depOffsetMin < 40 ? 'Boarding' : (((h>>7)%10)===0 ? 'Delayed' : 'On Time')));
  const delayMin = status==='Delayed' ? 15 + (h%60) : 0;
  const aircraftList = Object.keys(AIRCRAFT);
  const aircraft = aircraftList[h % aircraftList.length];
  const seatTotal = 140 + (h%180);
  return {
    flightNo: code+' '+num, code, num, airline, dep, arr, distKm, durMin,
    depTime, arrTime, status, delayMin, aircraft, seatTotal,
    depGate: String.fromCharCode(65+(h%6)) + (1+(h%30)),
    arrGate: String.fromCharCode(65+((h>>2)%6)) + (1+((h>>2)%30)),
    depTerm: 1+(h%5), arrTerm: 1+((h>>2)%5),
    baggage: (1+(h%20)),
    onTimePct: 65 + (h%30),
    wifi: h%3!==0, usb: h%2===0, ife: h%4!==0, power: h%3!==0,
    first: h%5===0? 8:0, business: 16+(h%20), economy: seatTotal-16-(h%20)-(h%5===0?8:0),
  };
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function trackFlight(flightNoOverride){
  const input = document.getElementById('flightInput');
  const flightNo = (flightNoOverride || input.value || '').trim().toUpperCase();
  if(!flightNo){ input.focus(); return; }
  const f = generateFlight(flightNo);
  cur.flight = f;
  // recents
  let rc = LS.get('ff_rc', []).filter(x=>x!==f.flightNo);
  rc.unshift(f.flightNo); rc = rc.slice(0,6);
  LS.set('ff_rc', rc); renderRecentBar();
  // history
  let hs = LS.get('ff_hs', []);
  hs.unshift({flightNo:f.flightNo, airline:f.airline.name, route:f.dep.c+'→'+f.arr.c, status:f.status, date:new Date().toISOString().slice(0,10)});
  LS.set('ff_hs', hs.slice(0,50));
  LS.set('ff_last', f.flightNo);
  renderDashboard();
  input.value='';
}

      ` : `

        <div class="check-item">🚪 Head to gate ${f.depGate} by ${fmtTime(new Date(f.depTime.getTime()-40*60000),f.dep.tz)}</div>

      `}

      <div class="tabs">
        <button class="tab active" id="tab-pack" onclick="switchTab('pack')">Packing</button>
        <button class="tab" id="tab-sec" onclick="switchTab('sec')">Security</button>
        <button class="tab" id="tab-trans" onclick="switchTab('trans')">Transport</button>
      </div>

    </div>

    <div class="card">
      <h3>Flight Path</h3>
      <div class="map-wrap" id="mapWrap"></div>
    </div>
  `;
  switchTab('pack');
  loadWeather(f);
  drawMap(f);
  if(window._cdInterval) clearInterval(window._cdInterval);
  window._cdInterval = setInterval(()=>{
    const c = document.querySelector('.countdown');
    if(c && cur.flight) c.innerHTML = countdownText(cur.flight);
  },30000);
}
function countdownText(f){
  const now = new Date();
  if(f.status==='Landed') return '✅ Flight has landed';
  if(f.status==='In Air') return '✈️ Currently in the air';
  if(f.status==='Cancelled') return '❌ Flight cancelled';
  const diff = f.depTime - now;
  if(diff<0) return '✈️ Currently in the air';
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
  return `⏱️ Departs in ${h}h ${m}m`;
}

function switchTab(t){

function unitConv(){
  return {
    temp: LS.get('ff_u_temp','F'), wind: LS.get('ff_u_wind','mph'),
    dist: LS.get('ff_u_dist','mi'), pres: LS.get('ff_u_pres','hPa'),
  };
}
async function loadWeather(f){
  const body = document.getElementById('wxBody');
  const key = LS.get('ff_wk','');
  const u = unitConv();
  if(!key){
    body.innerHTML = `<p>No OpenWeatherMap API key — add one in Settings to see live weather at ${f.arr.city}.</p>`;
    return;
  }
  try{
    const units = u.temp==='F' ? 'imperial' : 'metric';
    const wRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(f.arr.city)}&appid=${key}&units=${units}`);
    if(!wRes.ok) throw new Error('weather fetch failed');
    const w = await wRes.json();
    const emoji = wxEmoji(w.weather[0].main);
    const otherTemp = units==='imperial' ? Math.round((w.main.temp-32)*5/9) : Math.round(w.main.temp*9/5+32);
    let aqiHTML = '';
    try{
      const aRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${w.coord.lat}&lon=${w.coord.lon}&appid=${key}`);
      const a = await aRes.json();
      const aqi = a.list[0].main.aqi;
      const labels=['','Good','Fair','Moderate','Poor','Very Poor'];
      const colors=['','#16a34a','#84cc16','#eab308','#f97316','#dc2626'];
      aqiHTML = `<div class="small-note" style="margin-top:.6rem">Air Quality: <b>${labels[aqi]}</b></div><div class="aqi-bar"><div class="aqi-fill" style="width:${aqi*20}%;background:${colors[aqi]}"></div></div>`;
    }catch(e){}
    body.innerHTML = `
      <div class="wx-top"><span class="wx-emoji">${emoji}</span><div>
        <div class="wx-temp">${Math.round(w.main.temp)}°${units==='imperial'?'F':'C'} <small>(${otherTemp}°${units==='imperial'?'C':'F'})</small></div>
        <div class="wx-desc">${w.weather[0].description}</div>
        <div class="small-note">${f.arr.city} · ${f.arr.c}</div>
      </div></div>
      <div class="wx-grid">
        <div>Feels like<br><b>${Math.round(w.main.feels_like)}°</b></div>
        <div>Humidity<br><b>${w.main.humidity}%</b></div>
        <div>Wind<br><b>${Math.round(w.wind.speed)} ${units==='imperial'?'mph':'km/h'}</b></div>
        <div>Visibility<br><b>${units==='imperial'?Math.round(w.visibility/1609):Math.round(w.visibility/1000)} ${units==='imperial'?'mi':'km'}</b></div>
        <div>Pressure<br><b>${w.main.pressure} hPa</b></div>
        <div>Cloud cover<br><b>${w.clouds.all}%</b></div>
      </div>
      ${aqiHTML}
      <div class="wx-foot">OpenWeatherMap · Updated ${fmtTime(new Date(),-new Date().getTimezoneOffset()/60)} · Refreshes every ${LS.get('ff_wref',10)}m</div>
    `;
  }catch(e){
    body.innerHTML = `<p>Couldn't load live weather right now. Check your OpenWeatherMap key in Settings.</p>`;
  }
}
function wxEmoji(main){
  const m={Clear:'☀️',Clouds:'⛅',Rain:'🌧️',Drizzle:'🌦️',Thunderstorm:'⛈️',Snow:'❄️',Mist:'🌫️',Fog:'🌫️',Haze:'🌫️'};
  return m[main]||'🌤️';
}

function drawMap(f){
  const wrap = document.getElementById('mapWrap');
  const dark = document.documentElement.getAttribute('data-mode')==='dark';
  const ocean = dark ? '#1e3050' : '#b8d8e8';
  const land = dark ? '#2d4a3e' : '#c8d8a0';
  const stroke = dark ? '#3d5f4e' : '#9db07a';
  let grid = '';
  for(let lon=-180;lon<=180;lon+=30){ const [x] = toXY(lon,0); grid += `<line x1="${x}" y1="0" x2="${x}" y2="360" stroke="${dark?'#26314a':'#dbe6ee'}" stroke-width="1"/>`; }
  for(let lat=-90;lat<=90;lat+=30){ const [,y] = toXY(0,lat); const dash = lat===0?'stroke-dasharray="4 3"':''; grid += `<line x1="0" y1="${y}" x2="720" y2="${y}" stroke="${dark?'#26314a':'#dbe6ee'}" stroke-width="1" ${dash}/>`; }
  const shapes = LAND_SHAPES.map(pts=>`<polygon points="${pts.map(([lo,la])=>toXY(lo,la).join(',')).join(' ')}" fill="${land}" stroke="${stroke}" stroke-width="1"/>`).join('');
  const [dx,dy] = toXY(f.dep.lon,f.dep.lat), [ax,ay] = toXY(f.arr.lon,f.arr.lat);
  const mx = (dx+ax)/2, my = (dy+ay)/2 - Math.abs(dx-ax)*0.12 - 10;
  const arc = `<path d="M${dx},${dy} Q${mx},${my} ${ax},${ay}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const markers = `
    <circle cx="${dx}" cy="${dy}" r="7" fill="#4f6ef7" stroke="#fff" stroke-width="1.5"/>
    <text x="${dx}" y="${dy+3}" font-size="6" fill="#fff" text-anchor="middle" font-weight="700">${f.dep.c}</text>
    <circle cx="${ax}" cy="${ay}" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
    <text x="${ax}" y="${ay+3}" font-size="6" fill="#fff" text-anchor="middle" font-weight="700">${f.arr.c}</text>
  `;
  wrap.innerHTML = `<svg viewBox="0 0 720 360" style="width:100%;height:100%;background:${ocean}">${grid}${shapes}${arc}${markers}</svg>`;
}

function exportData(){

  `;

function calcBagWeight(){
  let v = parseFloat(document.getElementById('bwVal').value)||0;
  const unit = document.getElementById('bwUnit').value;
  const kg = unit==='lbs' ? v*0.453592 : v;
  const [limVal, limUnit] = document.getElementById('bwLimit').value.split('-');
  const limKg = limUnit==='lbs' ? limVal*0.453592 : parseFloat(limVal);
  const pct = Math.min(150, Math.round(kg/limKg*100));
  const over = kg>limKg;
  const color = pct<80?'#16a34a':pct<=100?'#eab308':'#dc2626';
  document.getElementById('bwResult').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${color}"></div></div>
    <p style="font-weight:700;color:${color}">${over?`⚠️ Overweight by ${(kg-limKg).toFixed(1)} kg (${((kg-limKg)/0.453592).toFixed(1)} lbs) — expect a fee`:`✅ ${(limKg-kg).toFixed(1)} kg (${((limKg-kg)/0.453592).toFixed(1)} lbs) under the limit`}</p>
  `;
}

    let cache = LS.get('ff_rates_cache', {});
    let rates;
    if(cache.base===from && cache.ts && (Date.now()-cache.ts)<86400000){
      rates = cache.rates;
    } else {
      const r = await fetch(`https://open.er-api.com/v6/latest/${from}`);
      const j = await r.json();
      rates = j.rates;
      LS.set('ff_rates_cache', {base:from, rates, ts:Date.now()});
    }
    const rate = rates[to];
    res.innerHTML = `${amt} ${from} = <b>${(amt*rate).toFixed(2)} ${to}</b><br><span class="small-note">1 ${from} = ${rate.toFixed(4)} ${to} · open.er-api.com</span>`;
  }catch(e){
    res.textContent = 'Could not fetch live rate — check your connection.';
  }
}

/* ---- 20. Jet Lag ---- */
function clockFaceSVG(hour, min, label){
  const hAngle = (hour%12+min/60)/12*360, mAngle = min/60*360;
  const hx = 40+22*Math.sin(hAngle*Math.PI/180), hy = 40-22*Math.cos(hAngle*Math.PI/180);
  const mx = 40+30*Math.sin(mAngle*Math.PI/180), my = 40-30*Math.cos(mAngle*Math.PI/180);
  return `<svg width="90" height="100" viewBox="0 0 80 100">
    <circle cx="40" cy="40" r="36" fill="none" stroke="var(--bd)" stroke-width="2"/>
    <line x1="40" y1="40" x2="${hx}" y2="${hy}" stroke="var(--tx)" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="${mx}" y2="${my}" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="2.5" fill="var(--tx)"/>
    <text x="40" y="95" text-anchor="middle" font-size="11" fill="var(--tx)">${label}</text>
  </svg>`;
}
function modalJetlag(){
  if(!cur.flight) return {title:'😴 Jet Lag Calculator', html: noFlight()};
  const f = cur.flight;
  const tzDiff = f.arr.tz - f.dep.tz;
  const eastward = tzDiff > 0;
  const absDiff = Math.abs(tzDiff);
  const severity = absDiff<=2?'✅ Minimal':absDiff<=4?'🟢 Mild':absDiff<=6?'🟡 Moderate':absDiff<=9?'🟠 Significant':'🔴 Severe';
  const recoveryDays = Math.ceil(absDiff*0.75);
  const now = new Date();
  const depH = ((now.getUTCHours()+f.dep.tz)%24+24)%24, arrH = ((now.getUTCHours()+f.arr.tz)%24+24)%24;
  const tips = eastward ? [
    ["Get morning sunlight at your destination","Helps advance your body clock forward."],
    ["Avoid naps after 3pm local time","Naps delay adjustment when traveling east."],
    ["Shift bedtime earlier 2-3 nights before","Pre-adapts your circadian rhythm."],
    ["Use melatonin in the evening if needed","Signals your body it's time to sleep earlier."],
    ["Stay hydrated, limit alcohol on board","Dehydration worsens jet lag symptoms."],
    ["Eat meals on destination schedule ASAP","Food timing helps reset your internal clock."],
  ] : [
    ["Get evening light, avoid early morning sun","Helps delay your body clock, matching westward shift."],
    ["Stay up slightly later on arrival night","Westward adjustment is usually easier — lean into it."],
    ["Shift bedtime later 2-3 nights before","Pre-adapts you to the new, later schedule."],
    ["Exercise lightly in the afternoon","Afternoon activity helps delay sleep onset naturally."],
    ["Limit caffeine after early afternoon","Keeps your new, later bedtime achievable."],
    ["Expect faster adjustment than eastward trips","The body adapts to delay more easily than advance."],
  ];
  const html = `
    <div style="display:flex;justify-content:space-around">${clockFaceSVG(Math.floor(depH),now.getUTCMinutes(),f.dep.c)}${clockFaceSVG(Math.floor(arrH),now.getUTCMinutes(),f.arr.c)}</div>
    <div class="countdown" style="text-align:center;margin-top:.6rem">${severity} · ${absDiff}h shift (${eastward?'eastward':'westward'}) · ~${recoveryDays} day${recoveryDays!==1?'s':''} to fully adjust</div>
    <p class="small-note" style="margin-top:.5rem">Expect: ${absDiff<=3?'mild grogginess, gone within a day':absDiff<=6?'noticeable fatigue and appetite shifts for a few days':'significant disruption to sleep and alertness for the better part of a week'}.</p>
    <div class="modal-section"><h3 style="font-size:13px">Tips for ${eastward?'eastward':'westward'} travel</h3>
      ${tips.map(([t,d])=>`<div class="check-item" style="align-items:flex-start"><span>💡</span><span><b>${t}</b><br><span class="small-note">${d}</span></span></div>`).join('')}
    </div>
  `;
  return {title:'😴 Jet Lag Calculator', html};
}

function toggleBingo(i){ const s = LS.get('ff_bingo',{}); s[i]=!s[i]; LS.set('ff_bingo',s); openModal('bingo'); }

/* ===================== KEYBOARD SHORTCUTS ===================== */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('flightInput').focus(); return; }
  if(e.key==='Escape'){ closeModal(); return; }
  if(typing) return;
  if(e.key==='?'){ openModal('shortcuts'); }
  else if(e.key.toLowerCase()==='d'){ const m=LS.get('ff_dk','auto'); const dark = document.documentElement.getAttribute('data-mode')==='dark'; LS.set('ff_dk', dark?'0':'1'); applyTheme(); if(cur.flight) drawMap(cur.flight); }
  else if(e.key.toLowerCase()==='s'){ openModal('settings'); }
  else if(e.key.toLowerCase()==='h'){ openModal('history'); }
  else if(e.key.toLowerCase()==='p'){ openModal('stats'); }
  else if(e.key.toLowerCase()==='r'){ if(cur.flight) trackFlight(cur.flight.flightNo); }
});

/* ===================== INIT ===================== */
function init(){
  applyTheme();
  renderClockStrip();
  renderRecentBar();
  const last = LS.get('ff_last', null);
  if(last){ document.getElementById('flightInput').value=''; trackFlight(last); }
  else renderDashboard();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
