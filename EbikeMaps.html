<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>ebike Maps</title>
<style>
  /*
    Layout: a fixed-canvas city schematic (SVG roads + pins, pan/zoom by hand)
    sits full-bleed behind floating glass UI, exactly like Apple Maps' chrome
    over a basemap. This is navigation, not a directory: search a place or
    tap anywhere on the map, get a real routed path and turn-by-turn steps.
    Routing is computed, not scripted: Dijkstra over a hand-built street
    graph, discounted on dedicated ebike lanes, turned into turn-by-turn
    steps from the route's own geometry (bearings between edges).
  */
  :root {
    --bg: #eef0f2;
    --surface: rgba(255, 255, 255, 0.86);
    --surface-solid: #ffffff;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --border: rgba(0, 0, 0, 0.08);
    --shadow: 0 10px 30px rgba(20, 24, 30, 0.16);
    --accent: #0a7cff;
    --lane: #af52de;
    --land: #e3e6e9;
    --road: #ffffff;
    --road-edge: #c8ccd2;
    --water: #a9d3ea;
    --park: #c3e0c6;
    --label: #8a8f96;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: rgba(28, 28, 30, 0.82);
      --surface-solid: #1c1c1e;
      --text: #f2f2f7;
      --text-dim: #9b9ba1;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      --accent: #409cff;
      --lane: #bf5af2;
      --land: #1c1c1e;
      --road: #2e2e30;
      --road-edge: #3c3c3e;
      --water: #123a52;
      --park: #11311d;
      --label: #6c6c70;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: rgba(28, 28, 30, 0.82);
    --surface-solid: #1c1c1e;
    --text: #f2f2f7;
    --text-dim: #9b9ba1;
    --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    --accent: #409cff;
    --lane: #bf5af2;
    --land: #1c1c1e;
    --road: #2e2e30;
    --road-edge: #3c3c3e;
    --water: #123a52;
    --park: #11311d;
    --label: #6c6c70;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  .stage { position: fixed; inset: 0; background: var(--land); touch-action: none; }
  .stage svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .stage svg.dragging { cursor: grabbing; }

  .road-label {
    font-size: 11px;
    font-weight: 600;
    fill: var(--label);
    letter-spacing: 0.02em;
    paint-order: stroke;
    stroke: var(--land);
    stroke-width: 3px;
  }

  .node-dot { cursor: pointer; fill: var(--road-edge); }
  .node-dot:hover { fill: var(--accent); }

  .place-pin { cursor: pointer; }
  .place-pin circle.ring { fill: #fff; opacity: 0; transition: opacity .15s; }
  .place-pin:hover circle.ring, .place-pin.selected circle.ring { opacity: 0.28; }

  .you-marker circle.pulse {
    fill: var(--accent);
    opacity: 0.25;
    transform-origin: center;
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.35; }
    70% { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .you-marker circle.pulse { animation: none; opacity: 0.18; }
  }

  .route-ghost { stroke: var(--accent); stroke-opacity: 0.3; }
  .route-travelled { stroke: var(--accent); }
  .ride-dot { fill: var(--accent); stroke: #fff; stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35)); }
  .dest-pin-dot { fill: #ff3b30; stroke: #fff; stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35)); }

  /* ---------------- floating chrome ---------------- */
  .topbar {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .search-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border-radius: 16px;
    padding: 11px 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .search-pill svg { flex: none; color: var(--text-dim); }
  .search-pill input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    min-width: 0;
  }
  .search-pill input::placeholder { color: var(--text-dim); }

  .theme-toggle {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(142, 142, 147, 0.18);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .lane-chip {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 14px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid var(--border);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .lane-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lane); flex: none; }
  .lane-chip.active { background: var(--lane); color: #fff; border-color: transparent; }
  .lane-chip.active .dot { background: #fff; }

  .right-controls {
    position: absolute;
    right: max(14px, env(safe-area-inset-right));
    bottom: 132px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ctrl-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    cursor: pointer;
  }
  .ctrl-btn:active { transform: scale(0.94); }

  /* ---------------- bottom sheet (search / suggestions) ---------------- */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 21;
    padding-left: max(0px, env(safe-area-inset-left));
    padding-right: max(0px, env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface-solid);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18);
    max-height: 50%;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
    transition: transform .25s ease;
  }
  .sheet.collapsed { transform: translateY(calc(100% - 92px)); }

  .sheet-handle {
    width: 36px;
    height: 5px;
    border-radius: 3px;
    background: rgba(142, 142, 147, 0.4);
    margin: 8px auto 2px;
    cursor: pointer;
  }
  .sheet-header { padding: 2px 18px 10px; cursor: pointer; }
  .sheet-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .sheet-header p { margin: 2px 0 0; font-size: 13px; color: var(--text-dim); }
  .sheet-list { overflow-y: auto; padding: 0 10px 14px; }

  .place-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-radius: 12px;
    cursor: pointer;
  }
  .place-row:active { background: rgba(142, 142, 147, 0.12); }

  .pin-badge {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .place-info { flex: 1; min-width: 0; }
  .place-info .name { font-size: 15px; font-weight: 600; }
  .place-info .meta { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }

  .place-dist { font-size: 13px; color: var(--text-dim); flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  .empty-hint { padding: 20px 18px 28px; text-align: center; color: var(--text-dim); font-size: 13.5px; }

  /* ---------------- route preview card ---------------- */
  .preview-card {
    position: absolute;
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 22;
    background: var(--surface-solid);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px;
    transform: translateY(120%);
    transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  }
  .preview-card.open { transform: translateY(0); }

  .preview-top { display: flex; align-items: flex-start; gap: 12px; }
  .preview-title { flex: 1; min-width: 0; }
  .preview-title .name { font-size: 18px; font-weight: 700; text-wrap: balance; }
  .preview-title .sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .close-btn {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(142, 142, 147, 0.2);
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
  }

  .preview-stats { display: flex; gap: 20px; margin: 14px 0; font-variant-numeric: tabular-nums; }
  .preview-stats div { font-size: 13px; color: var(--text-dim); }
  .preview-stats div b { display: block; font-size: 19px; color: var(--text); font-weight: 700; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: rgba(142, 142, 147, 0.16); color: var(--text); font-weight: 600; }
  .preview-actions { display: flex; gap: 10px; }

  /* ---------------- directions / turn-by-turn panel ---------------- */
  .directions-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 23;
    padding-left: max(0px, env(safe-area-inset-left));
    padding-right: max(0px, env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface-solid);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
    max-height: 76%;
    display: flex;
    flex-direction: column;
    transform: translateY(110%);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .directions-panel.open { transform: translateY(0); }

  .dir-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .dir-header .sum { flex: 1; min-width: 0; }
  .dir-header .sum .to { font-size: 15px; font-weight: 700; }
  .dir-header .sum .meta { font-size: 13px; color: var(--text-dim); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .dir-header button.icon-btn {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(142, 142, 147, 0.18);
    color: var(--text-dim);
    cursor: pointer;
  }

  .step-list { overflow-y: auto; padding: 6px 8px 10px; }
  .step-row { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 12px; }
  .step-row.current { background: rgba(10, 124, 255, 0.1); }
  .turn-icon {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(142, 142, 147, 0.14);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-row.current .turn-icon { background: var(--accent); color: #fff; }
  .step-row .text { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; }
  .step-row .dist { flex: none; font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .dir-footer { padding: 10px 16px 14px; border-top: 1px solid var(--border); display: flex; }

  .nav-active { display: none; flex-direction: column; gap: 12px; padding: 16px; }
  .directions-panel.navigating .step-list,
  .directions-panel.navigating .dir-footer { display: none; }
  .directions-panel.navigating .nav-active { display: flex; }

  .nav-instruction { display: flex; align-items: center; gap: 14px; }
  .nav-instruction .turn-icon { width: 52px; height: 52px; background: var(--accent); color: #fff; }
  .nav-instruction .turn-icon svg { width: 26px; height: 26px; }
  .nav-instruction .text { font-size: 19px; font-weight: 700; text-wrap: balance; }
  .nav-instruction .sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .nav-progress { height: 6px; border-radius: 3px; background: rgba(142, 142, 147, 0.2); overflow: hidden; }
  .nav-progress > div { height: 100%; background: var(--accent); width: 0%; transition: width .15s linear; }

  .nav-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .nav-stats b { color: var(--text); font-size: 15px; font-weight: 700; }

  .nav-controls { display: flex; gap: 10px; }

  @media (min-width: 720px) {
    .topbar { left: 50%; margin-left: -210px; width: 420px; }
    .sheet, .preview-card, .directions-panel { left: 50%; margin-left: -210px; width: 420px; }
    .sheet.collapsed { transform: translateY(calc(100% - 92px)); }
    .preview-card.open { transform: translateY(0); }
    .directions-panel.open { transform: translateY(0); }
    .right-controls { right: calc(50% - 210px - 56px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="map" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div class="topbar">
  <div class="search-pill">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Search a destination, or tap the map">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 12 3Z"/></svg>
    </button>
  </div>
  <div class="lane-chip" id="laneChip"><span class="dot"></span>Prefer ebike lanes</div>
</div>

<div class="right-controls">
  <button class="ctrl-btn" id="centerBtn" title="Center on you" aria-label="Center on you">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="ctrl-btn" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
  <button class="ctrl-btn" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
</div>

<div class="sheet collapsed" id="sheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-header" id="sheetHeader">
    <h2 id="sheetTitle">Where to?</h2>
    <p id="sheetSubtitle">Search a destination or tap anywhere on the map</p>
  </div>
  <div class="sheet-list" id="sheetList"></div>
</div>

<div class="preview-card" id="previewCard">
  <div class="preview-top">
    <div class="preview-title">
      <div class="name" id="previewName">—</div>
      <div class="sub" id="previewSub">—</div>
    </div>
    <button class="close-btn" id="previewClose" aria-label="Clear destination">✕</button>
  </div>
  <div class="preview-stats" id="previewStats"></div>
  <div class="preview-actions">
    <button class="btn secondary" id="previewStepsBtn">Steps</button>
    <button class="btn primary" id="previewGoBtn">Go</button>
  </div>
</div>

<div class="directions-panel" id="directionsPanel">
  <div class="dir-header">
    <div class="sum">
      <div class="to" id="dirTo">—</div>
      <div class="meta" id="dirMeta">—</div>
    </div>
    <button class="icon-btn" id="dirClose" aria-label="Close directions">✕</button>
  </div>

  <div class="step-list" id="stepList"></div>
  <div class="dir-footer">
    <button class="btn primary" id="startNavBtn" style="width:100%">Start navigation</button>
  </div>

  <div class="nav-active" id="navActive">
    <div class="nav-instruction">
      <div class="turn-icon" id="navTurnIcon"></div>
      <div>
        <div class="text" id="navText">—</div>
        <div class="sub" id="navSub">—</div>
      </div>
    </div>
    <div class="nav-progress"><div id="navProgressBar"></div></div>
    <div class="nav-stats">
      <div><b id="navTimeLeft">—</b> remaining</div>
      <div><b id="navDistLeft">—</b> to go</div>
    </div>
    <div class="nav-controls">
      <button class="btn secondary" id="navPauseBtn">Pause</button>
      <button class="btn secondary" id="navExitBtn">Exit</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= street graph (the "real" map) ================= */
  var ROWS = 5, COLS = 6, ROW_SPACING = 150, COL_SPACING = 150, MARGIN = 70;
  var STREETS = ["Harbor St", "Union St", "Market St", "Pine St", "Bay St"];
  var AVENUES = ["1st Ave", "2nd Ave", "3rd Ave", "4th Ave", "5th Ave", "6th Ave"];
  var MI_PER_UNIT = 0.00047; // ~ a 150-unit block is roughly 0.07 miles
  var EBIKE_MPH = 12;
  var LANE_DISCOUNT = 0.85; // routing prefers dedicated ebike lanes when reasonable
  var YOU_NODE = "r3c1";

  function nodeId(r, c) { return "r" + r + "c" + c; }

  var NODES = {};
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      NODES[nodeId(r, c)] = { x: MARGIN + c * COL_SPACING, y: MARGIN + r * ROW_SPACING, r: r, c: c };
    }
  }

  var EDGE_DEFS = [];
  for (var r2 = 0; r2 < ROWS; r2++) {
    for (var c2 = 0; c2 < COLS - 1; c2++) {
      EDGE_DEFS.push({ a: nodeId(r2, c2), b: nodeId(r2, c2 + 1), street: STREETS[r2], lane: STREETS[r2] === "Market St" });
    }
  }
  for (var c3 = 0; c3 < COLS; c3++) {
    for (var r3 = 0; r3 < ROWS - 1; r3++) {
      EDGE_DEFS.push({ a: nodeId(r3, c3), b: nodeId(r3 + 1, c3), street: AVENUES[c3], lane: false });
    }
  }
  [[4, 0, 3, 1], [3, 1, 2, 2], [2, 2, 1, 3], [1, 3, 0, 4]].forEach(function (p) {
    EDGE_DEFS.push({ a: nodeId(p[0], p[1]), b: nodeId(p[2], p[3]), street: "Grand Ave", lane: true });
  });

  function geoDist(a, b) {
    var dx = NODES[b].x - NODES[a].x, dy = NODES[b].y - NODES[a].y;
    return Math.sqrt(dx * dx + dy * dy) * MI_PER_UNIT;
  }

  var GRAPH = {};
  Object.keys(NODES).forEach(function (id) { GRAPH[id] = []; });
  EDGE_DEFS.forEach(function (e) {
    var d = geoDist(e.a, e.b);
    var w = e.lane ? d * LANE_DISCOUNT : d;
    GRAPH[e.a].push({ to: e.b, dist: d, weight: w, street: e.street, lane: e.lane });
    GRAPH[e.b].push({ to: e.a, dist: d, weight: w, street: e.street, lane: e.lane });
  });

  function dijkstra(source) {
    var distMap = {}, weightMap = {}, prev = {}, visited = {};
    Object.keys(NODES).forEach(function (id) { distMap[id] = Infinity; weightMap[id] = Infinity; });
    distMap[source] = 0; weightMap[source] = 0;
    var queue = [[0, source]];
    while (queue.length) {
      queue.sort(function (a, b) { return a[0] - b[0]; });
      var top = queue.shift(), w = top[0], u = top[1];
      if (visited[u]) continue;
      visited[u] = true;
      GRAPH[u].forEach(function (edge) {

    var total = pathLength(points);
    if (total === 0) return points[0];
    var target = total * frac, acc = 0;
    for (var i = 1; i < points.length; i++) {
      var segLen = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      if (acc + segLen >= target || i === points.length - 1) {
        var segFrac = segLen > 0 ? (target - acc) / segLen : 0;
        return { x: points[i - 1].x + (points[i].x - points[i - 1].x) * segFrac, y: points[i - 1].y + (points[i].y - points[i - 1].y) * segFrac };
      }
      acc += segLen;
    }
    return points[points.length - 1];
  }

  document.getElementById("startNavBtn").addEventListener("click", startNav);
  document.getElementById("navPauseBtn").addEventListener("click", togglePause);
  document.getElementById("navExitBtn").addEventListener("click", function () {
    stopNav();
    dirPanel.classList.remove("navigating");
  });

  var navTotalDist = 0, navStepBoundaries = [];
  function startNav() {
    if (!currentSteps.length) return;
    dirPanel.classList.add("open", "navigating");
    rideDot.style.display = "";
    routeTravelled.style.display = "";
    navTotalDist = 0;
    navStepBoundaries = [];
    currentSteps.forEach(function (step) { navTotalDist += step.distance; navStepBoundaries.push(navTotalDist); });
    navPaused = false;
    navElapsedAtPause = 0;
    currentStepIndex = -1;
    navStartTs = performance.now();
    document.getElementById("navPauseBtn").textContent = "Pause";
    tickNav();
  }

  function stopNav() {
    navPaused = true;
    if (navTimer) cancelAnimationFrame(navTimer);
    navTimer = null;
    rideDot.style.display = "none";
    routeTravelled.style.display = "none";
    routeTravelled.setAttribute("stroke-dasharray", "0 100000");
  }

  function togglePause() {
    if (navPaused) {
      navPaused = false;
      navStartTs = performance.now() - navElapsedAtPause;
      document.getElementById("navPauseBtn").textContent = "Pause";
      tickNav();
    } else {
      navPaused = true;
      navElapsedAtPause = performance.now() - navStartTs;
      if (navTimer) cancelAnimationFrame(navTimer);
      document.getElementById("navPauseBtn").textContent = "Resume";
    }
  }

  function tickNav() {
    if (navPaused) return;
    var elapsed = performance.now() - navStartTs;
    var frac = Math.min(1, elapsed / SIM_DURATION_MS);
    var pos = pointAtFraction(currentPathPoints, frac);
    rideDot.setAttribute("cx", pos.x);
    rideDot.setAttribute("cy", pos.y);

    var totalLen = pathLength(currentPathPoints);
    routeTravelled.setAttribute("stroke-dasharray", (totalLen * frac) + " " + totalLen);

    var travelled = navTotalDist * frac;
    var stepIdx = 0;
    for (var i = 0; i < navStepBoundaries.length; i++) {
      if (travelled < navStepBoundaries[i]) { stepIdx = i; break; }
      stepIdx = i;
    }
    updateNavUi(stepIdx, frac);

    if (frac < 1) {
      navTimer = requestAnimationFrame(tickNav);
    } else {
      updateNavUi(currentSteps.length - 1, 1);
    }
  }

  function updateNavUi(stepIdx, frac) {
    if (stepIdx !== currentStepIndex) {
      currentStepIndex = stepIdx;
      document.querySelectorAll(".step-row").forEach(function (row) {
        row.classList.toggle("current", Number(row.dataset.idx) === stepIdx);
      });
      var step = currentSteps[stepIdx];
      document.getElementById("navTurnIcon").innerHTML = TURN_ICON[step.type];
      document.getElementById("navText").textContent = step.text;
      document.getElementById("navSub").textContent = step.distance > 0 ? fmtMiles(step.distance) : "Final stop";
    }
    document.getElementById("navProgressBar").style.width = (frac * 100) + "%";
    var remainingMi = ROUTE.dist[selectedNode] * (1 - frac);
    document.getElementById("navTimeLeft").textContent = frac >= 1 ? "Arrived" : fmtMinutes(remainingMi);
    document.getElementById("navDistLeft").textContent = frac >= 1 ? "0.0 mi" : fmtMiles(remainingMi);
  }

  /* ================= init ================= */
  renderSuggestions();
})();
</script>
</body>
</html>
